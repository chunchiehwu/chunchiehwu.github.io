name: Update Google Scholar Citations

on:
  schedule:
    - cron: "23 6 * * 1,3,5" # Monday, Wednesday, Friday at 06:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: scholar-citations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Refresh the schedule even when Scholar is unavailable or counts are unchanged.
      - name: Keep the citation workflow active
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.enableWorkflow({
              ...context.repo,
              workflow_id: 'update-citations.yml'
            });
            await core.summary.addRaw('Citation schedule keepalive completed.').write();

  update-citations:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install citation dependencies
        run: python -m pip install -r requirements-citations.txt

      - name: Test citation cache handling
        run: python -m unittest discover -s tests -v

      - name: Update Google Scholar citations
        id: fetch
        run: timeout 180 python -u bin/update_scholar_citations.py --force

      - name: Report fetch failure
        if: failure() && steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Google Scholar refresh failed; the previous citation data has been retained."
          echo "Google Scholar refresh failed. Check the fetch log for blocking, network errors, or a timeout. The previous citation data remains published." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changed citations
        id: commit
        run: |
          git add _data/citations.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Google Scholar fetch succeeded; citation counts are unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "chore: update Google Scholar citations"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Google Scholar citations updated; the site will be rebuilt automatically." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: update-citations
    if: needs.update-citations.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.update-citations.outputs.revision }}
